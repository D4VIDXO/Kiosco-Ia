# ============================================================
#  KIOSCO — Configuración de Streamlit
#  Tema: negro y vino tinto
# ============================================================

[theme]
base = "dark"
backgroundColor = "#0D0A0B"
secondaryBackgroundColor = "#181213"
textColor = "#F2EAE8"
primaryColor = "#C2415A"
font = "sans serif"

[server]
port = 8501
# false = abre el navegador solo al iniciar (cómodo con el .bat)
headless = false
enableXsrfProtection = true

[client]
# Oculta los menús de desarrollo (Deploy, etc.)
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[logger]
level = "warning"
messageFormat = "%(asctime)s %(message)s"