# ============================================================
#  KIOSCO — Configuración de Streamlit
#  Tema: negro y azul marino
# ============================================================

[theme]
base = "dark"
backgroundColor = "#05070C"
secondaryBackgroundColor = "#0B111D"
textColor = "#E8EEF9"
primaryColor = "#3B6FE0"
font = "sans serif"

[server]
port = 8501
# false = abre el navegador solo al iniciar (cómodo con el .bat)
headless = false
enableXsrfProtection = true

[client]
# Oculta los menús de desarrollo (Deploy, etc.)
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[logger]
level = "warning"
messageFormat = "%(asctime)s %(message)s"

[server]
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
backgroundColor = "#080C14"
secondaryBackgroundColor = "#101828"
primaryColor = "#4A90E2"
textColor = "#E8F0FC"
font = "sans serif"